<html>
<head>
    <title>Assignment-18 : Mini Project: Accessible Student Admission Page</title>
</head>
<body>
    <header style="background-color:#1a237e; color:white; padding:15px">
    <h1 align="center">ABC College Admission 2026</h1>
  </header>
 
  <main>
    <h2>Courses and Fees</h2>
 
    <table border="1" cellpadding="8" cellspacing="0" width="100%">
      <caption>Available Courses</caption>
 
      <thead>
        <tr>
          <th bgcolor="#e8eaf6">Course</th>
          <th bgcolor="#e8eaf6">Seats</th>
          <th bgcolor="#e8eaf6">Fees</th>
        </tr>
      </thead>
 
      <tbody>
        <tr>
          <td>B.Tech CSE</td>
          <td>120</td>
          <td>&#8377;90,000</td>
        </tr>
        <tr>
          <td>BCA</td>
          <td>60</td>
          <td>&#8377;45,000</td>
        </tr>
      </tbody>
    </table>
 
    <br>
 
    <form action="submit.php" method="post">
      <fieldset>
        <legend>Application Form</legend>
 
        <p>
          <label for="name">Name:</label><br>
          <input type="text" id="name" name="name" required>
        </p>
 
        <p>
          <label for="email">Email:</label><br>
          <input type="email" id="email" name="email" required>
        </p>
 
        <p>
          <label for="course">Course:</label><br>
          <select id="course" name="course">
            <option value="btech">B.Tech CSE</option>
            <option value="bca">BCA</option>
          </select>
        </p>
 
        <p>
          <label for="statement">Statement:</label><br>
          <textarea id="statement" name="statement" rows="4" cols="50"></textarea>
        </p>
 
        <p>
          <input type="submit" value="Apply">
        </p>
      </fieldset>
    </form>
  </main>
 
  <footer style="background-color:#1a237e; color:white; padding:12px">
    <p align="center">&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
